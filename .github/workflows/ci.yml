name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24]
    # Real MariaDB for server/test/api/* (integration suite). Credentials/DB
    # name mirror docker-compose.dev.yml's kith-dev-db conventions and
    # healthcheck; port 33071 and the kith_test/_test-suffixed DB name match
    # server/test/api/helpers.js's defaults (and its `_test` suffix guard).
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root
          MARIADB_DATABASE: kith_test
          MARIADB_USER: kith_test
          MARIADB_PASSWORD: kith-test-password
        ports:
          - 33071:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=10s
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 33071
          DB_USER: kith_test
          DB_PASSWORD: kith-test-password
          DB_NAME: kith_test
          DB_SSL: 'false'

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
